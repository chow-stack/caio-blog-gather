name: Daily Gather

on:
  schedule:
    # Every day at 12:37 PM UTC (8:37 AM EDT / 7:37 AM EST)
    - cron: '37 12 * * *'
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser (crawl4ai / Patchright)
        run: crawl4ai-setup

      - name: Create vault log path
        # gather.py writes to ../caio-os/Blog/log.md — stub the directory so the
        # script doesn't crash.
        run: mkdir -p ../caio-os/Blog

      - name: Run gather.py
        run: python gather.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates/ seen_urls.json digests/
          git diff --staged --quiet || git commit -m "gather: $(date -u +%Y-%m-%d)"
          git push

      - name: Run daily_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python daily_digest.py
