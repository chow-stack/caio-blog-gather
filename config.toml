[digest]
name = "Caio's AI Brief"
tagline = "The AI news worth knowing"
max_articles = 10
recency_hours = 48
top_stories = 3
seen_retention_days = 60

[models]
primary = "gemini-3.5-flash"
fallbacks = ["gemini-3.5-flash-lite"]

[email]
from = "cdesouza202@gmail.com"
to = ["cdesouza202@gmail.com"]
smtp_host = "smtp.gmail.com"
smtp_port = 587
show_candidate_count = false
show_model = true

[theme]
accent = "#3157d5"
background = "#f6f7f9"
surface = "#ffffff"
text = "#182230"
muted = "#667085"
border = "#e4e7ec"

[sections]
top_stories = "Top stories"
important_developments = "Important developments"
builder_tools = "Builder tools & open source"
market_signals = "Market signals"
other_notable = "Also worth knowing"

